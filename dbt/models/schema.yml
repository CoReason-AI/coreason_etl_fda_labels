version: 2

models:
  - name: coreason_etl_fda_labels_silver_fda_labels
    description: >
      The Silver layer table extracting core properties from the bronze_fda_labels_raw JSONB.
      It coalesces complex clinical text arrays into single text block strings for downstream mapping.
    columns:
      - name: coreason_id
        description: Primary key generated via UUIDv5 from the namespace and set_id.
        tests:
          - unique
          - not_null
      - name: source_id
        description: The SPL set_id natively from the FDA JSON payload.
        tests:
          - unique
          - not_null
      - name: brand_name
        description: The brand name of the label (from openfda nested object).
      - name: generic_name
        description: The generic name of the label (from openfda nested object).
      - name: indications_and_usage
        description: Coalesced text block for the Indications and Usage section.
      - name: boxed_warning
        description: Coalesced text block for the Boxed Warning section.
      - name: adverse_reactions
        description: Coalesced text block for the Adverse Reactions section.
      - name: contraindications
        description: Coalesced text block for the Contraindications section.
      - name: active_ingredient
        description: Coalesced text block for the Active Ingredient section.
      - name: dosage_and_administration
        description: Coalesced text block for the Dosage and Administration section.
      - name: inactive_ingredient
        description: Coalesced text block for the Inactive Ingredient section.
      - name: package_label_principal_display_panel
        description: Coalesced text block for the Package Label Principal Display Panel section.
      - name: ingestion_ts
        description: Timestamp when the initial record was ingested into Bronze.
        tests:
          - not_null

  - name: coreason_etl_fda_labels_silver_fda_application_numbers
    description: >
      The Silver layer table responsible for unnesting the 1-to-many relationship between
      FDA labels and their application numbers. It standardizes the application numbers
      by removing alphabetic prefixes (e.g., NDA, ANDA) and whitespace.
    columns:
      - name: coreason_id
        description: Primary key generated via UUIDv5 from the namespace and set_id.
        tests:
          - not_null
          - relationships:
              to: ref('coreason_etl_fda_labels_silver_fda_labels')
              field: coreason_id
      - name: source_id
        description: The SPL set_id natively from the FDA JSON payload.
        tests:
          - not_null
          - relationships:
              to: ref('coreason_etl_fda_labels_silver_fda_labels')
              field: source_id
      - name: application_number
        description: The standardized application number stripped of prefixes and whitespace.
        tests:
          - not_null
      - name: ingestion_ts
        description: Timestamp when the initial record was ingested into Bronze.
        tests:
          - not_null

  - name: coreason_etl_fda_labels_gold_clinical_topology
    description: >
      A unified, denormalized Gold manifold mapping distinct FDA label clinical sections
      to their corresponding standardized application numbers.
      AGENT INSTRUCTION: This model exhibits a 1-to-Many fan-out cardinality due to
      the inner join with application numbers. The primary key is the composite of
      coreason_id and application_number.
    columns:
      - name: coreason_id
        description: Identifier generated via UUIDv5 from the namespace and set_id.
        tests:
          - not_null
          - relationships:
              to: ref('coreason_etl_fda_labels_silver_fda_labels')
              field: coreason_id
      - name: source_id
        description: The SPL set_id natively from the FDA JSON payload.
        tests:
          - not_null
          - relationships:
              to: ref('coreason_etl_fda_labels_silver_fda_labels')
              field: source_id
      - name: application_number
        description: The standardized application number stripped of prefixes and whitespace.
        tests:
          - not_null
      - name: brand_name
        description: The brand name of the label.
      - name: generic_name
        description: The generic name of the label.
      - name: indications_and_usage
        description: Coalesced text block for the Indications and Usage section.
      - name: boxed_warning
        description: Coalesced text block for the Boxed Warning section.
      - name: adverse_reactions
        description: Coalesced text block for the Adverse Reactions section.
      - name: contraindications
        description: Coalesced text block for the Contraindications section.
      - name: active_ingredient
        description: Coalesced text block for the Active Ingredient section.
      - name: dosage_and_administration
        description: Coalesced text block for the Dosage and Administration section.
      - name: inactive_ingredient
        description: Coalesced text block for the Inactive Ingredient section.
      - name: package_label_principal_display_panel
        description: Coalesced text block for the Package Label Principal Display Panel section.
      - name: ingestion_ts
        description: Timestamp when the initial record was ingested into Bronze.
        tests:
          - not_null
