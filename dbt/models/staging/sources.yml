version: 2

sources:
  - name: fda_spl_source
    schema: bronze
    description: "The Bronze layer ingestion manifold for the openFDA SPL dataset."
    tables:
      - name: bronze_fda_labels_raw
        description: "The raw JSON representation of FDA drug labels and prescribing information. This data has been ingested losslessly with a strictly typed UUIDv5 coreason_id."
        columns:
          - name: _dlt_id
            description: "Internal record identifier created by dlt."
          - name: partition_url
            description: "Metadata indicating the HTTPS source coordinate of the ZIP dataset."
          - name: ingestion_ts
            description: "The timestamp this record was materialized into the Bronze layer."
          - name: coreason_id
            description: "Vectorized UUIDv5 generated deterministically via polars (NAMESPACE_FDALABEL + set_id) to serve as a high-performance primary key before reaching dbt."
            tests:
              - not_null
          - name: raw_data
            description: "The complete, deeply nested JSON representation of the openFDA payload."
